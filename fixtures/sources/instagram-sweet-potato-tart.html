✅ Worth the Hype (8.5/10)

Sweet Potato Tart — A really innovative, fun, and tasty lunch that also acts as meal prep. It all comes together in one bowl/pan, is super easy, really tasty, full of micro and macro nutrients, and great for you!

Full Recipe (Divides into 4 servings)
* Sweet potatoes — 400g (approx. 14 oz / 2 to 2.5 medium sweet potatoes)
* Low fat cottage cheese — 250g (approx. 8.8 oz / 1 cup)
* Mushrooms — 100g (approx. 3.5 oz / 1 cup sliced)
* Red Peppers — 50g (approx. 1.8 oz / 1/3 cup diced)
* Red Onions — 50g (approx. 1.8 oz / 1/3 cup diced)
* Spinach — 100g (approx. 3.5 oz / 3 packed cups)
* Parmesan — 30g (approx. 1 oz / 1/3 cup grated)
* Large eggs — 4
* Salt, Paprika &amp; Pepper — to taste

Steps:
1. Mash the cooked potatoes and press them into a round baking mould to form a base.
2. Add the filling (cottage cheese, mushrooms, red peppers, red onions, spinach, eggs, and seasonings), top with parmesan, and bake at 180°C for 35 minutes.

Macros (per serving)
* Calories: 251 cals
* Protein: 18g
* Fat: 8g
* Carbs: 27g
* Fibre: 5g

Verdict
8.5/10 — A really innovative, fun, and above all, tasty lunch option that doubles seamlessly as meal prep. Everything comes together effortlessly in one bowl or pan, making it super easy to prepare while remaining packed with essential micro and macro nutrients. It’s genuinely great for you and well worth adding to your routine.
